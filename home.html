
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>mObywatel - Dokumenty</title>

    <link rel="stylesheet" href="assets/main.css">
    <link rel="stylesheet" href="assets/home.css">

    <link rel="icon" type="image/png"
          href="assets/images/logo.png">
    <link rel="apple-touch-icon"
          href="assets/images/logo.png">

    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
</head>

<body>

    <!-- MAIN CONTENT -->

    <main class="container">


        <div class="top_grid">
            <img
                src="assets/images/logo_rounded.png"
                class="top_image"
                alt="Logo"
            >
        </div>


<div class="top_icons">
    <img src="assets/images/grid_images.png" alt="Top icons">
</div>

        <section class="card_grid">

            <h1 class="title">Dokumenty</h1>

            <div class="button_group">

                <button type="button"
                        class="main_button customize_button">
                    Dostosuj
                </button>

                <button type="button"
                        class="main_button add_button">
                    Dodaj
                </button>

            </div>

            <div class="scroll-container">

                <a class="card" href="card.html">
                    <img
                        class="background"
                        src="assets/images/id_card.png"
                        alt="Przykładowa karta dokumentu"
                    >
                </a>

            </div>

        </section>

    </main>

    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom_bar" aria-label="Nawigacja główna">

        <div class="bottom_bar_grid">

            <a class="bottom_element_grid"
               href="home.html">

                <div class="bottom_element_image documents_open"></div>
                <p class="bottom_element_text_open">Dokumenty</p>

            </a>

            <a class="bottom_element_grid"
               href="services.html">

                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>

            </a>

            <a class="bottom_element_grid"
               href="qr.html">

                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>

            </a>

            <a class="bottom_element_grid"
               href="search.html">

                <div class="bottom_element_image search_nav"></div>
                <p class="bottom_element_text">Szukaj</p>

            </a>

            <a class="bottom_element_grid"
               href="more.html">

                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>

            </a>

        </div>

    </nav>

    <script src="assets/manifest.js"></script>

</body>
</html>
